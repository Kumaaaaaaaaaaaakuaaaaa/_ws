<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        #map {
            height: 600px;
            width: 100%;
        }
    </style>
</head>

<body>
    <h1>我的地圖</h1>
    <div id="map"></div>


    <script src="https://maps.app.goo.gl/YrA1gVu9X3HUqnWNA"></script>
    <script>
        
        var map = L.map('map').setView([24, 118], 13); 

        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        
        L.marker([24, 118]).addTo(map)
            .bindPopup("金門大學")
            .openPopup();
    </script>
    <img src="IMG_4787.png">
</body>

</html>
